[project]
name = "estimator-cag"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.101.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "instructor>=1.6",
    "jinja2>=3.1.6",
    "litellm>=1.83.0",
    "openai>=2.36.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.9",
    "redis[hiredis]>=7.4.0",
    "redisvl>=0.4",
    "streamlit>=1.57.0",
    "structlog>=25.5.0",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.15.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: tests que pegan al LLM real o requieren servicios externos",
]
