services:
  estimator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: estimator-cag
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Sobreescribe REDIS_URL del .env para usar la red interna de docker
      - REDIS_URL=redis://redis:6379/0
      # Postgres por red interna de docker (igual patrón que REDIS_URL):
      - DATABASE_URL=postgresql+asyncpg://estimator:estimator@postgres:5432/estimator
    volumes:
      - ./app:/app/app:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: >
      uv run --no-sync uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    restart: unless-stopped

  redis:
    # redis-stack incluye el módulo RediSearch que necesita redisvl.SemanticCache.
    # Con redis:7-alpine el cache semántico se queda deshabilitado en arranque.
    image: redis/redis-stack:latest
    container_name: estimator-redis
    ports:
      - "6379:6379"
      - "8001:8001"  # RedisInsight (UI opcional para inspeccionar el cache)
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16
    container_name: estimator-postgres
    environment:
      POSTGRES_DB: estimator
      POSTGRES_USER: estimator
      POSTGRES_PASSWORD: estimator
    ports:
      # Host 5433 (no 5432): evita la colisión con el Postgres de Herd que ocupa
      # localhost:5432. Dentro de la red de docker el contenedor sigue en 5432.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estimator -d estimator"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  redis-data:
  postgres_data:
