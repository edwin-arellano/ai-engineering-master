services:
  estimator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: estimator-cag
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Sobreescribe REDIS_URL del .env para usar la red interna de docker
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./app:/app/app:ro
      - ./fixtures:/app/fixtures:ro
    depends_on:
      redis:
        condition: service_healthy
    command: >
      uv run --no-sync uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: estimator-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
