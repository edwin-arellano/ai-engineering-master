services:
  estimator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: estimator-cag
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Montar código y fixtures en read-only para hot-reload en desarrollo
      - ./app:/app/app:ro
      - ./fixtures:/app/fixtures:ro
    command: >
      uv run --no-sync uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload
    restart: unless-stopped
